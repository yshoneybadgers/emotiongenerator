<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scatter!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #0f0e17;
    --surface: #1a1929;
    --accent: #ff6b35;
    --accent2: #f7c59f;
    --text: #fffffe;
    --muted: #a7a9be;
    --green: #2ec4b6;
    --red: #e63946;
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(255,107,53,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(46,196,182,0.06) 0%, transparent 60%);
  }

  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 4px 4px 0px rgba(255,107,53,0.3);
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .main-display {
    display: flex;
    gap: 20px;
    width: 100%;
    max-width: 900px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    flex: 1;
    min-width: 220px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .card.letter-card::before { background: var(--accent); }
  .card.category-card::before { background: var(--green); }
  .card.timer-card::before { background: var(--accent2); }

  .card-label {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .big-letter {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(4rem, 14vw, 8rem);
    line-height: 1;
    color: var(--accent);
    text-shadow: 6px 6px 0 rgba(255,107,53,0.25);
    transition: transform 0.1s;
  }

  .big-letter.spin {
    animation: letterSpin 0.5s ease-out;
  }

  @keyframes letterSpin {
    0% { transform: rotateY(0deg) scale(1.2); opacity: 0.3; }
    50% { transform: rotateY(180deg) scale(0.8); opacity: 0.6; }
    100% { transform: rotateY(360deg) scale(1); opacity: 1; }
  }

  .category-list {
    list-style: none;
    text-align: left;
    width: 100%;
  }

  .category-list li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    font-weight: 600;
    color: var(--text);
    animation: fadeSlide 0.35s ease-out both;
  }

  .category-list li:last-child { border-bottom: none; }

  .cat-num {
    font-family: 'Black Han Sans', sans-serif;
    color: var(--green);
    font-size: 0.85rem;
    min-width: 18px;
    opacity: 0.7;
  }

  .placeholder-text {
    color: var(--muted);
    font-size: 1rem;
    text-align: center;
    padding: 20px 0;
  }

  @keyframes fadeSlide {
    0% { transform: translateY(8px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* TIMER */
  .timer-display {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    letter-spacing: 4px;
    color: var(--accent2);
    transition: color 0.3s;
  }

  .timer-display.warning { color: var(--red); animation: pulse 0.5s infinite alternate; }

  @keyframes pulse {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }

  .timer-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .preset-btn {
    background: rgba(247,197,159,0.1);
    border: 1px solid rgba(247,197,159,0.3);
    color: var(--accent2);
    padding: 5px 12px;
    border-radius: 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .preset-btn:hover, .preset-btn.active {
    background: var(--accent2);
    color: var(--bg);
  }

  .custom-time {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 8px;
    justify-content: center;
  }

  .custom-time input {
    width: 60px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    text-align: center;
  }

  .custom-time button {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s;
  }

  .custom-time button:hover { background: rgba(255,255,255,0.15); }

  /* ACTION BUTTONS */
  .actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 900px;
    margin-bottom: 24px;
  }

  .btn {
    padding: 14px 28px;
    border-radius: 12px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    cursor: pointer;
    border: none;
    transition: transform 0.1s, box-shadow 0.1s;
    text-transform: uppercase;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 20px rgba(255,107,53,0.4);
  }

  .btn-primary:hover { box-shadow: 0 6px 28px rgba(255,107,53,0.6); }

  .btn-secondary {
    background: transparent;
    color: var(--green);
    border: 2px solid var(--green);
  }

  .btn-secondary:hover { background: rgba(46,196,182,0.1); }

  .btn-timer {
    background: transparent;
    color: var(--accent2);
    border: 2px solid var(--accent2);
  }

  .btn-timer:hover { background: rgba(247,197,159,0.1); }

  .btn-timer.running {
    background: var(--accent2);
    color: var(--bg);
  }

  /* CATEGORY POOL EDITOR */
  .pool-section {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .pool-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
  }

  .pool-header h2 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .toggle-icon { color: var(--muted); font-size: 1.2rem; transition: transform 0.2s; }
  .toggle-icon.open { transform: rotate(180deg); }

  .pool-body { display: none; }
  .pool-body.visible { display: block; }

  .pool-body textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 14px;
    resize: vertical;
    min-height: 140px;
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .pool-body textarea:focus { outline: none; border-color: rgba(255,107,53,0.5); }

  .pool-meta {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .pool-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .small-btn {
    padding: 7px 16px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    transition: background 0.15s;
  }

  .small-btn:hover { background: rgba(255,255,255,0.12); }

  /* HISTORY */
  .history-section {
    width: 100%;
    max-width: 900px;
  }

  .history-label {
    font-size: 0.7rem;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .history-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-pill {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .history-pill span { color: var(--accent); font-weight: 700; margin-right: 4px; }

  /* Responsive */
  @media (max-width: 500px) {
    .main-display { flex-direction: column; }
  }
</style>
</head>
<body>

<h1>SCATTER!</h1>
<p class="subtitle">Classroom Edition</p>

<div class="main-display">
  <!-- LETTER -->
  <div class="card letter-card">
    <div class="card-label">Letter</div>
    <div class="big-letter" id="letterDisplay">?</div>
  </div>

  <!-- CATEGORY -->
  <div class="card category-card" style="flex:2; min-width: 260px;">
    <div class="card-label">Categories</div>
    <div id="categoryDisplay"><p class="placeholder-text">Hit ROLL to start</p></div>
  </div>

  <!-- TIMER -->
  <div class="card timer-card">
    <div class="card-label">Timer</div>
    <div class="timer-display" id="timerDisplay">2:00</div>
    <div class="timer-controls">
      <button class="preset-btn active" onclick="setPreset(60)" data-sec="60">1 min</button>
      <button class="preset-btn" onclick="setPreset(120)" data-sec="120">2 min</button>
      <button class="preset-btn" onclick="setPreset(180)" data-sec="180">3 min</button>
    </div>
    <div class="custom-time">
      <input type="number" id="customMin" placeholder="min" min="0" max="59">
      <span style="color:var(--muted)">:</span>
      <input type="number" id="customSec" placeholder="sec" min="0" max="59">
      <button onclick="setCustomTime()">Set</button>
    </div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="rollAll()">🎲 Roll</button>
  <button class="btn btn-timer" id="timerBtn" onclick="toggleTimer()">▶ Start</button>
</div>

<!-- CATEGORY POOL EDITOR -->
<div class="pool-section">
  <div class="pool-header" onclick="togglePool()">
    <h2>📝 Category Pool</h2>
    <span class="toggle-icon" id="toggleIcon">▼</span>
  </div>
  <div class="pool-body" id="poolBody">
    <textarea id="categoryPool"></textarea>
    <div class="pool-meta" id="poolMeta"></div>
    <div class="pool-actions">
      <button class="small-btn" onclick="loadDefaults()">Reset to Defaults</button>
      <button class="small-btn" onclick="clearPool()">Clear All</button>
    </div>
  </div>
</div>

<!-- HISTORY -->
<div class="history-section" id="historySection" style="display:none">
  <div class="history-label">Round History</div>
  <div class="history-pills" id="historyPills"></div>
</div>

<script>
const DEFAULT_CATEGORIES = [
  "Animals", "Food & Drinks", "Countries", "Things in a School",
  "Sports", "Colors", "Boys' Names", "Girls' Names",
  "Things in a Kitchen", "Movies", "Music Artists", "Things That Are Round",
  "Jobs & Careers", "Things You Find Outside", "TV Shows", "Hobbies",
  "Things in a Bedroom", "Famous People", "Things That Are Cold",
  "Things You Wear", "Vehicles", "Things in a City", "Fruits",
  "Vegetables", "Board Games", "Things at the Beach", "School Subjects",
  "Superheroes", "Things That Make Noise", "Dances",
  "Things in a Hospital", "Types of Music", "Things in a Park",
  "Things That Are Soft", "Fast Food Items", "Things You Buy at a Store",
  "Things That Are Red", "Cartoon Characters", "Words That Mean 'Happy'",
  "Things That Can Fly", "Sports Teams", "Things in a Garage",
  "Things That Are Hot", "Famous Places", "Holiday Things",
  "Words That Mean 'Big'", "Things That Have Wheels", "Social Media Apps",
  "Things in a Movie Theater", "Things in a Backpack"
];

const LETTERS = 'ABCDEFGHIJKLMNOPRSTW'.split('');

let timerSeconds = 120;
let timerRunning = false;
let timerInterval = null;
let currentLetter = '';
let currentCategory = '';
let usedCategories = [];
let history = [];
let activePreset = 120;

// Init
function init() {
  const saved = localStorage.getItem('scatterCategories');
  const pool = saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
  document.getElementById('categoryPool').value = pool.join('\n');
  updateMeta();
  updateTimerDisplay();
}

function getPool() {
  return document.getElementById('categoryPool').value
    .split('\n').map(s => s.trim()).filter(Boolean);
}

function updateMeta() {
  const count = getPool().length;
  document.getElementById('poolMeta').textContent = `${count} categories in pool`;
  localStorage.setItem('scatterCategories', JSON.stringify(getPool()));
}

document.getElementById('categoryPool').addEventListener('input', updateMeta);

function rollAll() {
  const letter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
  currentLetter = letter;
  const el = document.getElementById('letterDisplay');
  el.textContent = letter;
  el.classList.remove('spin');
  void el.offsetWidth;
  el.classList.add('spin');

  currentCategories = pickCategories();
  renderCategories(currentCategories);

  if (currentCategories.length) {
    history.unshift({ letter, categories: currentCategories });
    if (history.length > 10) history.pop();
    renderHistory();
  }

  resetTimer();
}

let currentCategories = [];

function pickCategories() {
  let pool = getPool();
  if (!pool.length) return [];

  const count = Math.floor(Math.random() * 2) + 5; // 5 or 6
  const picked = [];

  for (let i = 0; i < count; i++) {
    let available = pool.filter(c => !usedCategories.includes(c) && !picked.includes(c));
    if (!available.length) {
      usedCategories = [];
      available = pool.filter(c => !picked.includes(c));
    }
    if (!available.length) break;
    const cat = available[Math.floor(Math.random() * available.length)];
    picked.push(cat);
    usedCategories.push(cat);
  }

  return picked;
}

function renderCategories(cats) {
  const el = document.getElementById('categoryDisplay');
  if (!cats.length) {
    el.innerHTML = '<p class="placeholder-text">No categories in pool</p>';
    return;
  }
  el.innerHTML = `<ul class="category-list">${cats.map((c, i) =>
    `<li style="animation-delay:${i * 0.06}s"><span class="cat-num">${i + 1}.</span>${c}</li>`
  ).join('')}</ul>`;
}

function newCategory() {
  pickCategory();
  if (currentLetter && currentCategory) {
    history.unshift({ letter: currentLetter, category: currentCategory });
    if (history.length > 10) history.pop();
    renderHistory();
  }
}

// TIMER
function setPreset(sec) {
  activePreset = sec;
  timerSeconds = sec;
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.sec) === sec);
  });
  resetTimer();
}

function setCustomTime() {
  const m = parseInt(document.getElementById('customMin').value) || 0;
  const s = parseInt(document.getElementById('customSec').value) || 0;
  const total = m * 60 + s;
  if (total > 0) {
    activePreset = total;
    timerSeconds = total;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    resetTimer();
  }
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const display = `${m}:${s.toString().padStart(2, '0')}`;
  const el = document.getElementById('timerDisplay');
  el.textContent = display;
  el.classList.toggle('warning', timerSeconds <= 10 && timerSeconds > 0);
}

function toggleTimer() {
  if (timerRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  timerRunning = true;
  const btn = document.getElementById('timerBtn');
  btn.textContent = '⏸ Pause';
  btn.classList.add('running');
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      btn.textContent = '▶ Start';
      btn.classList.remove('running');
      document.getElementById('timerDisplay').textContent = "TIME!";
      document.getElementById('timerDisplay').classList.add('warning');
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  const btn = document.getElementById('timerBtn');
  btn.textContent = '▶ Start';
  btn.classList.remove('running');
}

function resetTimer() {
  pauseTimer();
  timerSeconds = activePreset;
  updateTimerDisplay();
  document.getElementById('timerDisplay').classList.remove('warning');
  document.getElementById('timerBtn').textContent = '▶ Start';
}

// POOL EDITOR
function togglePool() {
  const body = document.getElementById('poolBody');
  const icon = document.getElementById('toggleIcon');
  body.classList.toggle('visible');
  icon.classList.toggle('open');
}

function loadDefaults() {
  document.getElementById('categoryPool').value = DEFAULT_CATEGORIES.join('\n');
  updateMeta();
}

function clearPool() {
  document.getElementById('categoryPool').value = '';
  updateMeta();
}

// HISTORY
function renderHistory() {
  const section = document.getElementById('historySection');
  const pills = document.getElementById('historyPills');
  section.style.display = history.length ? 'block' : 'none';
  pills.innerHTML = history.map(h =>
    `<div class="history-pill"><span>${h.letter}</span>${h.categories.join(', ')}</div>`
  ).join('');
}

init();
</script>
</body>
</html>
