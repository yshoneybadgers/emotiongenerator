<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Grid Winner Picker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f4f0; color: #1a1a18; height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding: 0.6rem 0.75rem; gap: 0.5rem; }
  h1 { font-size: 16px; font-weight: 500; flex-shrink: 0; }
  .layout { display: grid; grid-template-columns: 1fr 3fr; gap: 0.75rem; flex: 1; min-height: 0; }

  .grid-col { display: flex; flex-direction: column; min-height: 0; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; flex: 1; min-height: 0; }
  .cell { border-radius: 6px; border: 0.5px solid rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: #fff; transition: transform 0.1s, background 0.1s; user-select: none; position: relative; overflow: hidden; }
  .cell:hover:not(.claimed) { background: #e8e7e1; transform: scale(1.05); }
  .cell.claimed { cursor: pointer; }
  .cell .num { font-size: 11px; color: #1a1a18; position: absolute; top: 3px; left: 4px; line-height: 1; font-weight: 500; opacity: 0.5; }
  .cell .initials { font-size: 14px; font-weight: 600; line-height: 1.2; word-break: break-word; text-align: center; padding: 0 3px; color: #1a1a18; }
  .cell.winner-cell { outline: 4px solid #f0c040; outline-offset: 1px; animation: pulse 0.4s ease 3; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

  .winner-banner { border-radius: 10px; padding: 10px 14px; margin-top: 0.5rem; font-size: 18px; font-weight: 600; text-align: center; display: none; flex-shrink: 0; color: #1a1a18; border: 0.5px solid rgba(0,0,0,0.15); }

  .sidebar { display: flex; flex-direction: column; gap: 0.6rem; overflow-y: auto; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,0.12); padding: 0.875rem; flex-shrink: 0; }

  label { font-size: 12px; color: #666; display: block; margin-bottom: 5px; }
  input[type=text] { width: 100%; padding: 6px 10px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: #1a1a18; outline: none; }
  input[type=text]:focus { border-color: rgba(0,0,0,0.4); box-shadow: 0 0 0 2px rgba(0,0,0,0.06); }
  button { padding: 6px 14px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-size: 13px; font-family: inherit; background: transparent; color: #1a1a18; cursor: pointer; transition: background 0.12s, transform 0.1s; }
  button:hover { background: rgba(0,0,0,0.05); }
  button:active { transform: scale(0.97); }
  button.primary { background: #1a1a18; color: #fff; border-color: #1a1a18; font-size: 15px; width: 100%; padding: 10px; }
  button.primary:hover { background: #333; }
  button.danger { color: #a32d2d; border-color: rgba(163,45,45,0.3); width: 100%; }
  button.danger:hover { background: #fcebeb; }

  .name-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .name-row input { flex: 1; }
  .name-row button { white-space: nowrap; padding: 6px 10px; }

  .player-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .player-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1.5px solid transparent; transition: border-color 0.12s, background 0.12s; }
  .player-item:hover { background: rgba(0,0,0,0.03); }
  .player-item.active { border-color: #1a1a18; }
  .player-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .player-name { flex: 1; font-size: 14px; font-weight: 500; color: #1a1a18; }
  .player-count { font-size: 12px; color: #888; min-width: 18px; text-align: right; }
  .player-remove { font-size: 11px; color: #aaa; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .player-remove:hover { color: #a32d2d; background: #fcebeb; }

  .active-bar { border-radius: 8px; padding: 8px 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .active-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

  .reassign-modal { display: none; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 1rem; margin-top: 0.5rem; flex-shrink: 0; }
  .reassign-modal.open { display: block; }
  .reassign-inner { background: #fff; border-radius: 8px; padding: 0.875rem; }
  .reassign-inner h3 { font-size: 13px; font-weight: 500; margin-bottom: 10px; color: #1a1a18; }
  .reassign-options { display: flex; flex-wrap: wrap; gap: 6px; }
  .reassign-btn { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid rgba(0,0,0,0.2); color: #1a1a18; }
  .reassign-btn:hover { opacity: 0.85; }
  .unassign-btn { background: #f5f4f0; color: #555; border-color: rgba(0,0,0,0.15); }
</style>
</head>
<body>

<h1>100 grid winner picker</h1>

<div class="layout">
  <div class="sidebar">
    <div class="card">
      <label>Add student (max 15)</label>
      <div class="name-row">
        <input type="text" id="nameInput" placeholder="Name or initials" maxlength="12" />
        <button onclick="addPlayer()">+</button>
      </div>
      <div class="player-list" id="playerList"></div>
    </div>

    <div class="card" style="padding: 0.625rem 0.875rem;">
      <div style="font-size:11px; color:#888; margin-bottom:6px;">Active student</div>
      <div class="active-bar" id="activeBar" style="background:#f5f4f0;">
        <div class="active-dot" id="activeDot" style="background:#ccc;"></div>
        <span id="activeName" style="color:#999; font-weight:500;">none selected</span>
      </div>
    </div>

    <div class="card" style="display:flex; flex-direction:column; gap:8px;">
      <button class="primary" onclick="pickWinner()">Pick winner</button>
      <button onclick="confirmReset(this)" class="danger" id="resetBtn">Reset grid</button>
    </div>
  </div>

  <div class="grid-col">
    <div class="grid" id="grid"></div>
    <div class="winner-banner" id="winnerBanner"></div>
    <div class="reassign-modal" id="reassignModal">
      <div class="reassign-inner">
        <h3 id="reassignTitle">Reassign box</h3>
        <div class="reassign-options" id="reassignOptions"></div>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS = [
  { bg:'#EEEDFE', dot:'#7F77DD' },
  { bg:'#E1F5EE', dot:'#1D9E75' },
  { bg:'#FAECE7', dot:'#D85A30' },
  { bg:'#FBEAF0', dot:'#D4537E' },
  { bg:'#E6F1FB', dot:'#378ADD' },
  { bg:'#EAF3DE', dot:'#639922' },
  { bg:'#FAEEDA', dot:'#BA7517' },
  { bg:'#FCEBEB', dot:'#E24B4A' },
  { bg:'#E8F4F8', dot:'#2A8FA8' },
  { bg:'#F0EDE8', dot:'#7A6A54' },
  { bg:'#EDF5E1', dot:'#4E8A2A' },
  { bg:'#FEF3E2', dot:'#C4820A' },
  { bg:'#EEE8F8', dot:'#6B4DBF' },
  { bg:'#F8ECF0', dot:'#B03A6A' },
  { bg:'#E2F0EC', dot:'#2A7A5E' },
];

let players = [];
let activePlayer = null;
let cells = {};
let reassignTarget = null;

function addPlayer() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name || players.length >= 15) return;
  const color = COLORS[players.length % COLORS.length];
  players.push({ name, color, id: Date.now() });
  input.value = '';
  renderPlayers();
  if (!activePlayer) setActive(players[0]);
}

function setActive(p) {
  activePlayer = p;
  document.getElementById('activeName').textContent = p.name;
  document.getElementById('activeName').style.color = '#1a1a18';
  document.getElementById('activeDot').style.background = p.color.dot;
  document.getElementById('activeBar').style.background = p.color.bg;
  renderPlayers();
  closeReassign();
}

function removePlayer(id) {
  Object.values(cells).filter(c => c.owner && c.owner.id === id).forEach(c => {
    c.owner = null;
    c.el.classList.remove('claimed');
    c.el.style.background = '';
    c.el.querySelector('.initials').textContent = '';
    c.el.querySelector('.num').style.opacity = '0.5';
  });
  players = players.filter(p => p.id !== id);
  if (activePlayer && activePlayer.id === id) {
    activePlayer = players[0] || null;
    if (activePlayer) {
      setActive(activePlayer);
    } else {
      document.getElementById('activeName').textContent = 'none selected';
      document.getElementById('activeName').style.color = '#999';
      document.getElementById('activeDot').style.background = '#ccc';
      document.getElementById('activeBar').style.background = '#f5f4f0';
    }
  }
  renderPlayers();
}

function getCounts() {
  const counts = {};
  players.forEach(p => counts[p.id] = 0);
  Object.values(cells).forEach(c => { if (c.owner) counts[c.owner.id] = (counts[c.owner.id] || 0) + 1; });
  return counts;
}

function renderPlayers() {
  const list = document.getElementById('playerList');
  const counts = getCounts();
  list.innerHTML = '';
  players.forEach(p => {
    const item = document.createElement('div');
    item.className = 'player-item' + (activePlayer && activePlayer.id === p.id ? ' active' : '');
    item.innerHTML = `<div class="player-dot" style="background:${p.color.dot}"></div><span class="player-name">${p.name}</span><span class="player-count">${counts[p.id] || 0}</span><span class="player-remove" onclick="event.stopPropagation();removePlayer(${p.id})">✕</span>`;
    item.onclick = () => setActive(p);
    list.appendChild(item);
  });
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cells = {};
  for (let i = 1; i <= 100; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<span class="num">${i}</span><span class="initials"></span>`;
    cell.onclick = () => handleCellClick(i);
    grid.appendChild(cell);
    cells[i] = { el: cell, owner: null };
  }
}

function handleCellClick(num) {
  if (cells[num].owner) { openReassign(num); return; }
  if (!activePlayer) { alert('Select a student first!'); return; }
  claimCell(num, activePlayer);
}

function claimCell(num, player) {
  const cell = cells[num];
  cell.owner = player;
  cell.el.classList.add('claimed');
  cell.el.style.background = player.color.bg;
  const span = cell.el.querySelector('.initials');
  span.textContent = player.name;
  span.style.fontSize = player.name.length <= 4 ? '14px' : player.name.length <= 7 ? '11px' : '9px';
  cell.el.querySelector('.num').style.opacity = '0.4';
  renderPlayers();
}

function openReassign(num) {
  reassignTarget = num;
  const cell = cells[num];
  document.getElementById('reassignTitle').textContent = `Box ${num} — owned by ${cell.owner.name}. Reassign to:`;
  const opts = document.getElementById('reassignOptions');
  opts.innerHTML = '';
  players.forEach(p => {
    if (p.id === cell.owner.id) return;
    const btn = document.createElement('button');
    btn.className = 'reassign-btn';
    btn.style.background = p.color.bg;
    btn.style.borderColor = p.color.dot;
    btn.textContent = p.name;
    btn.onclick = () => { claimCell(num, p); closeReassign(); };
    opts.appendChild(btn);
  });
  const unBtn = document.createElement('button');
  unBtn.className = 'reassign-btn unassign-btn';
  unBtn.textContent = 'Unassign';
  unBtn.onclick = () => {
    const c = cells[num];
    c.owner = null; c.el.classList.remove('claimed'); c.el.style.background = '';
    c.el.querySelector('.initials').textContent = ''; c.el.querySelector('.num').style.opacity = '0.5';
    renderPlayers(); closeReassign();
  };
  opts.appendChild(unBtn);
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'reassign-btn unassign-btn';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = closeReassign;
  opts.appendChild(cancelBtn);
  document.getElementById('reassignModal').classList.add('open');
}

function closeReassign() {
  document.getElementById('reassignModal').classList.remove('open');
  reassignTarget = null;
}

function pickWinner() {
  document.querySelectorAll('.cell.winner-cell').forEach(c => c.classList.remove('winner-cell'));
  const banner = document.getElementById('winnerBanner');
  const claimed = Object.entries(cells).filter(([, c]) => c.owner);
  if (claimed.length === 0) {
    banner.textContent = 'No boxes claimed yet!';
    banner.style.background = '#f5f4f0';
    banner.style.display = 'block';
    return;
  }
  const [num, cell] = claimed[Math.floor(Math.random() * claimed.length)];
  cell.el.classList.add('winner-cell');
  banner.textContent = `Box ${num} — ${cell.owner.name} wins!`;
  banner.style.background = cell.owner.color.bg;
  banner.style.display = 'block';
}

let resetPending = false;
let resetTimer = null;

function confirmReset(btn) {
  if (resetPending) {
    clearTimeout(resetTimer);
    resetPending = false;
    btn.textContent = "Reset grid";
    btn.style.background = "";
    resetGrid();
  } else {
    resetPending = true;
    btn.textContent = "Click again to confirm";
    btn.style.background = "#fcebeb";
    resetTimer = setTimeout(() => {
      resetPending = false;
      btn.textContent = "Reset grid";
      btn.style.background = "";
    }, 3000);
  }
}

function resetGrid() {
  document.getElementById('winnerBanner').style.display = 'none';
  closeReassign();
  buildGrid();
  renderPlayers();
}

document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });
buildGrid();
</script>
</body>
</html>
