<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotion Word Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a2e;
      --cream: #fdf8f0;
      --warm: #f5efe3;
      --accent: #c97d4e;
      --accent2: #4e7dc9;
      --muted: #8a8070;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      background-image:
        radial-gradient(ellipse at 10% 20%, rgba(201,125,78,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(78,125,201,0.08) 0%, transparent 50%);
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header h1 span {
      color: var(--accent);
      font-style: italic;
    }

    header p {
      margin-top: 0.6rem;
      color: var(--muted);
      font-size: 1rem;
    }

    .search-area {
      max-width: 560px;
      margin: 0 auto 2.5rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .search-area input {
      flex: 1;
      min-width: 200px;
      padding: 0.85rem 1.2rem;
      border: 2px solid #ddd6c8;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      background: var(--card-bg);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-area input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201,125,78,0.15);
    }

    .search-area button {
      padding: 0.85rem 1.6rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .search-area button:hover { background: #b36b3e; }
    .search-area button:active { transform: scale(0.97); }

    .suggestions-label {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      max-width: 680px;
      margin: 0 auto 2.5rem;
    }

    .chip {
      padding: 0.4rem 1rem;
      border: 1.5px solid #ddd6c8;
      border-radius: 999px;
      background: var(--card-bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      color: var(--ink);
    }

    .chip:hover {
      border-color: var(--accent2);
      background: #eef3fb;
      color: var(--accent2);
    }

    #results {
      max-width: 800px;
      margin: 0 auto;
    }

    .result-header {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      text-align: center;
    }

    .result-header em {
      color: var(--accent);
      font-style: italic;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .category-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.2rem 1.3rem;
      border: 1.5px solid #ece5d8;
      animation: fadeUp 0.35s ease both;
    }

    .category-card:nth-child(2) { animation-delay: 0.05s; }
    .category-card:nth-child(3) { animation-delay: 0.10s; }
    .category-card:nth-child(4) { animation-delay: 0.15s; }
    .category-card:nth-child(5) { animation-delay: 0.20s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .category-title {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .word-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .word-pill {
      background: var(--warm);
      border-radius: 999px;
      padding: 0.3rem 0.85rem;
      font-size: 0.92rem;
      color: var(--ink);
      cursor: default;
      transition: background 0.15s;
      user-select: text;
    }

    .word-pill:hover {
      background: #ead9c3;
    }

    .definition-box {
      margin-top: 1.5rem;
      background: var(--card-bg);
      border-left: 4px solid var(--accent2);
      border-radius: 0 12px 12px 0;
      padding: 1rem 1.2rem;
      font-size: 0.95rem;
      color: #4a4a5a;
      line-height: 1.6;
      animation: fadeUp 0.3s ease both;
    }

    .definition-box strong {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    .not-found {
      text-align: center;
      color: var(--muted);
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 1.1rem;
      margin-top: 1rem;
      animation: fadeUp 0.3s ease both;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
      margin-top: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid #ddd6c8;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>Emotion <span>Word Explorer</span></h1>
  <p>Type an emotion to discover words that describe it</p>
</header>

<div class="search-area">
  <input type="text" id="emotionInput" placeholder="e.g. happy, frustrated, nervous…" autocomplete="off" />
  <button onclick="lookupEmotion()">Explore →</button>
</div>

<p class="suggestions-label">Try one of these</p>
<div class="suggestions" id="suggestions"></div>

<div id="results"></div>

<script>
  const suggestions = [
    "happy","sad","angry","anxious","surprised","disgusted",
    "proud","ashamed","lonely","excited","frustrated","hopeful","jealous","grateful"
  ];

  const suggestionsEl = document.getElementById("suggestions");
  suggestions.forEach(word => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = word;
    chip.onclick = () => {
      document.getElementById("emotionInput").value = word;
      lookupEmotion();
    };
    suggestionsEl.appendChild(chip);
  });

  document.getElementById("emotionInput").addEventListener("keydown", e => {
    if (e.key === "Enter") lookupEmotion();
  });

  async function lookupEmotion() {
    const input = document.getElementById("emotionInput").value.trim();
    if (!input) return;

    const resultsEl = document.getElementById("results");
    resultsEl.innerHTML = `<div class="loading"><span class="spinner"></span> Finding words…</div>`;

    const prompt = `The user wants synonyms and related words for the emotion: "${input}".

Please respond ONLY with valid JSON (no markdown, no explanation) in this exact format:
{
  "emotion": "the emotion word normalized",
  "brief_definition": "A one-sentence plain-language definition of this emotion suitable for a middle or high school student.",
  "categories": [
    {
      "label": "Milder versions",
      "words": ["word1", "word2", "word3", "word4", "word5"]
    },
    {
      "label": "Stronger versions",
      "words": ["word1", "word2", "word3", "word4", "word5"]
    },
    {
      "label": "Similar feelings",
      "words": ["word1", "word2", "word3", "word4", "word5"]
    },
    {
      "label": "Used in writing",
      "words": ["word1", "word2", "word3", "word4", "word5"]
    }
  ]
}

If the input is not an emotion, set emotion to null and all other fields to null.`;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });

      const data = await response.json();
      const text = data.content.map(i => i.text || "").join("").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);

      if (!parsed.emotion) {
        resultsEl.innerHTML = `<p class="not-found">Hmm, "${input}" doesn't seem to be an emotion. Try something like "happy," "scared," or "proud."</p>`;
        return;
      }

      let html = `<p class="result-header">Words for <em>${parsed.emotion}</em></p>`;

      if (parsed.brief_definition) {
        html += `<div class="definition-box"><strong>What does it mean?</strong>${parsed.brief_definition}</div>`;
      }

      html += `<div class="categories" style="margin-top:1.2rem;">`;
      for (const cat of parsed.categories) {
        html += `<div class="category-card">
          <div class="category-title">${cat.label}</div>
          <ul class="word-list">
            ${cat.words.map(w => `<li class="word-pill">${w}</li>`).join("")}
          </ul>
        </div>`;
      }
      html += `</div>`;

      resultsEl.innerHTML = html;

    } catch (err) {
      resultsEl.innerHTML = `<p class="not-found">Something went wrong. Please try again.</p>`;
    }
  }
</script>
</body>
</html>
