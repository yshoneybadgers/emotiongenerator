<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotion Word Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a2e;
      --cream: #fdf8f0;
      --warm: #f5efe3;
      --accent: #c97d4e;
      --accent2: #4e7dc9;
      --muted: #8a8070;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      background-image:
        radial-gradient(ellipse at 10% 20%, rgba(201,125,78,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(78,125,201,0.08) 0%, transparent 50%);
    }

    header { text-align: center; margin-bottom: 2.5rem; }

    header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header h1 span { color: var(--accent); font-style: italic; }
    header p { margin-top: 0.6rem; color: var(--muted); font-size: 1rem; }

    .search-area {
      max-width: 560px;
      margin: 0 auto 2.5rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .search-area input {
      flex: 1;
      min-width: 200px;
      padding: 0.85rem 1.2rem;
      border: 2px solid #ddd6c8;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      background: var(--card-bg);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-area input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201,125,78,0.15);
    }

    .search-area button {
      padding: 0.85rem 1.6rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .search-area button:hover { background: #b36b3e; }
    .search-area button:active { transform: scale(0.97); }

    .suggestions-label {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      max-width: 680px;
      margin: 0 auto 2.5rem;
    }

    .chip {
      padding: 0.4rem 1rem;
      border: 1.5px solid #ddd6c8;
      border-radius: 999px;
      background: var(--card-bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      color: var(--ink);
    }

    .chip:hover { border-color: var(--accent2); background: #eef3fb; color: var(--accent2); }

    #results { max-width: 800px; margin: 0 auto; }

    .result-header {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      text-align: center;
    }

    .result-header em { color: var(--accent); font-style: italic; }

    .definition-box {
      margin-bottom: 1.2rem;
      background: var(--card-bg);
      border-left: 4px solid var(--accent2);
      border-radius: 0 12px 12px 0;
      padding: 1rem 1.2rem;
      font-size: 0.95rem;
      color: #4a4a5a;
      line-height: 1.6;
      animation: fadeUp 0.3s ease both;
    }

    .definition-box strong {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .category-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.2rem 1.3rem;
      border: 1.5px solid #ece5d8;
      animation: fadeUp 0.35s ease both;
    }

    .category-card:nth-child(2) { animation-delay: 0.05s; }
    .category-card:nth-child(3) { animation-delay: 0.10s; }
    .category-card:nth-child(4) { animation-delay: 0.15s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .category-title {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .word-list { list-style: none; display: flex; flex-wrap: wrap; gap: 0.45rem; }

    .word-pill {
      background: var(--warm);
      border-radius: 999px;
      padding: 0.3rem 0.85rem;
      font-size: 0.92rem;
      color: var(--ink);
      transition: background 0.15s;
      user-select: text;
    }

    .word-pill:hover { background: #ead9c3; }

    .not-found {
      text-align: center;
      color: var(--muted);
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 1.1rem;
      margin-top: 1rem;
      animation: fadeUp 0.3s ease both;
    }
  </style>
</head>
<body>

<header>
  <h1>Emotion <span>Word Explorer</span></h1>
  <p>Type an emotion to discover words that describe it</p>
</header>

<div class="search-area">
  <input type="text" id="emotionInput" placeholder="e.g. happy, frustrated, nervous…" autocomplete="off" />
  <button onclick="lookupEmotion()">Explore →</button>
</div>

<p class="suggestions-label">Try one of these</p>
<div class="suggestions" id="suggestions"></div>

<div id="results"></div>

<script>
const EMOTIONS = {
  happy: {
    definition: "Feeling pleasure, joy, or contentment — like things are going well.",
    milder: ["pleased", "glad", "content", "cheerful", "satisfied"],
    stronger: ["ecstatic", "elated", "overjoyed", "thrilled", "euphoric"],
    similar: ["grateful", "hopeful", "optimistic", "delighted", "blissful"],
    writing: ["jubilant", "exuberant", "radiant", "beaming", "lighthearted"]
  },
  sad: {
    definition: "Feeling unhappy, sorrowful, or down — like something is missing or wrong.",
    milder: ["blue", "down", "gloomy", "wistful", "low"],
    stronger: ["devastated", "heartbroken", "despairing", "grief-stricken", "anguished"],
    similar: ["lonely", "melancholy", "dejected", "forlorn", "sorrowful"],
    writing: ["crestfallen", "disconsolate", "mournful", "woeful", "lamenting"]
  },
  angry: {
    definition: "Feeling strong displeasure or hostility — like something is unfair or wrong.",
    milder: ["annoyed", "irritated", "bothered", "displeased", "agitated"],
    stronger: ["furious", "enraged", "livid", "seething", "outraged"],
    similar: ["frustrated", "resentful", "bitter", "indignant", "hostile"],
    writing: ["incensed", "irate", "wrathful", "inflamed", "vexed"]
  },
  anxious: {
    definition: "Feeling worried or uneasy — like something bad might happen.",
    milder: ["uneasy", "unsettled", "nervous", "apprehensive", "wary"],
    stronger: ["terrified", "panicked", "frantic", "overwhelmed", "distressed"],
    similar: ["stressed", "worried", "tense", "restless", "fearful"],
    writing: ["trembling", "on edge", "fraught", "tormented", "alarmed"]
  },
  nervous: {
    definition: "Feeling jittery or on edge — often before something important or unknown.",
    milder: ["uneasy", "unsure", "hesitant", "timid", "uncertain"],
    stronger: ["panicked", "terrified", "petrified", "paralyzed", "frantic"],
    similar: ["anxious", "worried", "tense", "apprehensive", "jumpy"],
    writing: ["trembling", "on edge", "fraught", "skittish", "shaky"]
  },
  surprised: {
    definition: "Feeling caught off guard — when something unexpected happens.",
    milder: ["startled", "caught off guard", "taken aback", "puzzled", "curious"],
    stronger: ["astonished", "astounded", "stunned", "flabbergasted", "dumbfounded"],
    similar: ["shocked", "amazed", "bewildered", "wide-eyed", "speechless"],
    writing: ["awestruck", "thunderstruck", "incredulous", "agape", "transfixed"]
  },
  disgusted: {
    definition: "Feeling strong disapproval or revulsion — like something is gross or deeply wrong.",
    milder: ["put off", "displeased", "uncomfortable", "bothered", "uneasy"],
    stronger: ["revolted", "repulsed", "sickened", "nauseated", "horrified"],
    similar: ["appalled", "offended", "contemptuous", "averse", "scornful"],
    writing: ["loathing", "abhorring", "recoiling", "bristling", "wincing"]
  },
  proud: {
    definition: "Feeling satisfaction in your own or someone else's achievement.",
    milder: ["pleased", "satisfied", "glad", "content", "gratified"],
    stronger: ["triumphant", "exultant", "beaming", "glorified", "honored"],
    similar: ["confident", "accomplished", "fulfilled", "respected", "dignified"],
    writing: ["strutting", "radiant", "swelling with pride", "distinguished", "noble"]
  },
  ashamed: {
    definition: "Feeling embarrassed or guilty about something you did or are.",
    milder: ["embarrassed", "self-conscious", "uncomfortable", "awkward", "sheepish"],
    stronger: ["mortified", "humiliated", "disgraced", "degraded", "devastated"],
    similar: ["guilty", "remorseful", "regretful", "sorry", "contrite"],
    writing: ["crestfallen", "chagrined", "abashed", "red-faced", "discomfited"]
  },
  lonely: {
    definition: "Feeling isolated or disconnected — like you are alone even around others.",
    milder: ["solitary", "withdrawn", "quiet", "distant", "detached"],
    stronger: ["abandoned", "desolate", "forsaken", "isolated", "bereft"],
    similar: ["sad", "longing", "homesick", "yearning", "alienated"],
    writing: ["forlorn", "adrift", "hollow", "estranged", "melancholy"]
  },
  excited: {
    definition: "Feeling enthusiastic and eager — like something great is about to happen.",
    milder: ["eager", "interested", "hopeful", "curious", "pleased"],
    stronger: ["ecstatic", "exhilarated", "elated", "euphoric", "electric"],
    similar: ["happy", "enthusiastic", "energized", "pumped", "thrilled"],
    writing: ["animated", "buzzing", "aglow", "fervent", "ablaze"]
  },
  frustrated: {
    definition: "Feeling blocked or stuck — like your efforts aren't getting results.",
    milder: ["annoyed", "impatient", "bothered", "unsatisfied", "irked"],
    stronger: ["furious", "exasperated", "enraged", "defeated", "helpless"],
    similar: ["angry", "stressed", "discouraged", "overwhelmed", "resentful"],
    writing: ["seething", "chafing", "at wits' end", "vexed", "agitated"]
  },
  hopeful: {
    definition: "Feeling like things will get better — looking forward with optimism.",
    milder: ["okay", "steady", "calm", "open", "willing"],
    stronger: ["elated", "inspired", "certain", "visionary", "radiant"],
    similar: ["optimistic", "encouraged", "expectant", "trusting", "faithful"],
    writing: ["buoyant", "luminous", "anticipating", "yearning", "aspiring"]
  },
  jealous: {
    definition: "Feeling resentful when someone has something you want.",
    milder: ["envious", "wistful", "covetous", "longing", "wishing"],
    stronger: ["consumed", "obsessed", "bitter", "possessive", "resentful"],
    similar: ["insecure", "competitive", "threatened", "inferior", "suspicious"],
    writing: ["green-eyed", "smoldering", "festering", "coveting", "brooding"]
  },
  grateful: {
    definition: "Feeling thankful — appreciating what you have or what others have done.",
    milder: ["thankful", "appreciative", "glad", "relieved", "pleased"],
    stronger: ["deeply moved", "overwhelmed with thanks", "humbled", "indebted", "touched"],
    similar: ["content", "happy", "warm", "blessed", "fortunate"],
    writing: ["beholden", "gracious", "heartfelt", "moved", "cherishing"]
  },
  scared: {
    definition: "Feeling frightened — like something is dangerous or threatening.",
    milder: ["uneasy", "wary", "nervous", "cautious", "startled"],
    stronger: ["terrified", "petrified", "horrified", "paralyzed", "panic-stricken"],
    similar: ["anxious", "fearful", "threatened", "vulnerable", "alarmed"],
    writing: ["trembling", "shuddering", "frozen", "cowering", "wide-eyed"]
  },
  confused: {
    definition: "Feeling uncertain or unclear — like you can't make sense of something.",
    milder: ["unsure", "puzzled", "uncertain", "curious", "lost"],
    stronger: ["baffled", "bewildered", "disoriented", "stumped", "dumbfounded"],
    similar: ["overwhelmed", "anxious", "hesitant", "doubtful", "flustered"],
    writing: ["perplexed", "muddled", "at sea", "foggy", "mystified"]
  },
  embarrassed: {
    definition: "Feeling self-conscious and awkward — usually after something went wrong socially.",
    milder: ["awkward", "self-conscious", "flustered", "uncomfortable", "sheepish"],
    stronger: ["mortified", "humiliated", "devastated", "disgraced", "horrified"],
    similar: ["ashamed", "guilty", "exposed", "vulnerable", "timid"],
    writing: ["crimson-faced", "abashed", "chagrined", "squirming", "cringing"]
  },
  bored: {
    definition: "Feeling uninterested or unstimulated — like nothing is engaging or exciting.",
    milder: ["uninterested", "restless", "indifferent", "disengaged", "flat"],
    stronger: ["soul-crushed", "lifeless", "numbed", "vacant", "hollow"],
    similar: ["tired", "apathetic", "unmotivated", "listless", "detached"],
    writing: ["languishing", "yawning", "glazed over", "adrift", "withering"]
  },
  calm: {
    definition: "Feeling peaceful and relaxed — free from stress or worry.",
    milder: ["okay", "fine", "steady", "neutral", "comfortable"],
    stronger: ["serene", "tranquil", "blissful", "zen", "placid"],
    similar: ["relaxed", "content", "at ease", "grounded", "settled"],
    writing: ["composed", "unruffled", "still", "centered", "unbothered"]
  },
  overwhelmed: {
    definition: "Feeling like there is too much to handle — buried under stress or emotion.",
    milder: ["busy", "stressed", "pressured", "tired", "stretched"],
    stronger: ["crushed", "drowning", "paralyzed", "broken down", "consumed"],
    similar: ["anxious", "exhausted", "frustrated", "helpless", "defeated"],
    writing: ["inundated", "submerged", "besieged", "swamped", "suffocating"]
  },
  disgusted: {
    definition: "Feeling strong revulsion — like something is deeply wrong or gross.",
    milder: ["put off", "uncomfortable", "uneasy", "bothered", "displeased"],
    stronger: ["revolted", "repulsed", "sickened", "nauseated", "horrified"],
    similar: ["appalled", "offended", "contemptuous", "averse", "scornful"],
    writing: ["loathing", "abhorring", "recoiling", "bristling", "wincing"]
  },
  curious: {
    definition: "Feeling interested and eager to learn or discover something.",
    milder: ["interested", "open", "attentive", "wondering", "inquisitive"],
    stronger: ["fascinated", "captivated", "obsessed", "enthralled", "driven"],
    similar: ["excited", "hopeful", "engaged", "alert", "hungry"],
    writing: ["probing", "exploring", "questioning", "searching", "investigative"]
  },
  guilty: {
    definition: "Feeling responsible for doing something wrong — and wishing you hadn't.",
    milder: ["regretful", "sorry", "uncomfortable", "troubled", "uneasy"],
    stronger: ["tormented", "consumed", "wretched", "plagued", "devastated"],
    similar: ["ashamed", "remorseful", "responsible", "culpable", "burdened"],
    writing: ["haunted", "burdened", "heavy-hearted", "conscience-stricken", "penitent"]
  },
  disappointed: {
    definition: "Feeling let down — when things didn't go the way you hoped.",
    milder: ["let down", "unsatisfied", "deflated", "unmotivated", "discouraged"],
    stronger: ["devastated", "crushed", "heartbroken", "despairing", "defeated"],
    similar: ["sad", "frustrated", "resigned", "regretful", "disillusioned"],
    writing: ["crestfallen", "forlorn", "deflated", "disheartened", "desolate"]
  }
};

const suggestionWords = [
  "happy","sad","angry","anxious","surprised",
  "proud","lonely","excited","frustrated","hopeful","jealous","grateful","scared","curious"
];

const suggestionsEl = document.getElementById("suggestions");
suggestionWords.forEach(word => {
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.textContent = word;
  chip.onclick = () => {
    document.getElementById("emotionInput").value = word;
    lookupEmotion();
  };
  suggestionsEl.appendChild(chip);
});

document.getElementById("emotionInput").addEventListener("keydown", e => {
  if (e.key === "Enter") lookupEmotion();
});

function lookupEmotion() {
  const raw = document.getElementById("emotionInput").value.trim().toLowerCase();
  const resultsEl = document.getElementById("results");

  if (!raw) return;

  // Try exact match first, then partial
  let key = Object.keys(EMOTIONS).find(k => k === raw);
  if (!key) key = Object.keys(EMOTIONS).find(k => k.startsWith(raw) || raw.startsWith(k));

  if (!key) {
    resultsEl.innerHTML = `<p class="not-found">Hmm, I don't have "${raw}" in my list yet. Try one of the suggestions above, or check the spelling!</p>`;
    return;
  }

  const data = EMOTIONS[key];

  const categories = [
    { label: "Milder versions", words: data.milder },
    { label: "Stronger versions", words: data.stronger },
    { label: "Similar feelings", words: data.similar },
    { label: "Used in writing", words: data.writing }
  ];

  let html = `<p class="result-header">Words for <em>${key}</em></p>`;
  html += `<div class="definition-box"><strong>What does it mean?</strong>${data.definition}</div>`;
  html += `<div class="categories">`;
  categories.forEach(cat => {
    html += `<div class="category-card">
      <div class="category-title">${cat.label}</div>
      <ul class="word-list">
        ${cat.words.map(w => `<li class="word-pill">${w}</li>`).join("")}
      </ul>
    </div>`;
  });
  html += `</div>`;

  resultsEl.innerHTML = html;
}
</script>
</body>
</html>
